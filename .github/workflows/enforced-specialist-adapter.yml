name: Enforced specialist adapter regression
on:
  push:
    paths:
      - 'runtime/enforced_specialist_adapter.py'
      - 'runtime/instruction_execution_gate.py'
      - 'scripts/test_enforced_specialist_adapter.py'
      - '.github/workflows/enforced-specialist-adapter.yml'
  pull_request:
    paths:
      - 'runtime/enforced_specialist_adapter.py'
      - 'runtime/instruction_execution_gate.py'
      - 'scripts/test_enforced_specialist_adapter.py'
      - '.github/workflows/enforced-specialist-adapter.yml'
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforced adapter tests
        run: python3 -m unittest scripts.test_enforced_specialist_adapter
