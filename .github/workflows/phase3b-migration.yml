name: Phase 3B versioned migration (draft PR only)
on:
  pull_request:
    paths:
      - 'scripts/migrate_lookup_phase3b.py'
      - '.github/workflows/phase3b-migration.yml'
permissions:
  contents: write
jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert all pending packages in the PR working tree
        run: python3 scripts/migrate_lookup_phase3b.py --source-ref "${{ github.event.pull_request.head.sha }}"
      - name: Validate registry and deterministic tests
        run: |
          python3 scripts/search_registry.py validate
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Commit the reviewed candidate sources and versioned ZIPs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry.json migration/PHASE3B_REPORT.json migration/inventory.json specialists orchestrators scripts/test_phase3_migration_staging.py
          git diff --cached --quiet && exit 0
          git commit -m 'Phase 3B: generate lookup-first specialist migration candidates'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
