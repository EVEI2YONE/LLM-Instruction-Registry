name: Rebuild instruction registry archives
on:
  push:
    branches:
      - feat/rebuild-instruction-registry-v2
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract, normalize directories, and rezip
        run: python3 scripts/rebuild_registry.py
      - name: Commit generated packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repackage instruction sets under canonical root folders" || exit 0
          git push
