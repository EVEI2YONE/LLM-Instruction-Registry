name: Registry discovery validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registry metadata and canonical paths
        run: python3 scripts/search_registry.py validate
      - name: Test agentic lookup behavior
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
